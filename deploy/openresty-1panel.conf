server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learnsphere.nianan.ggff.net;

    access_log /www/sites/learnsphere.nianan.ggff.net/log/access.log main;
    error_log /www/sites/learnsphere.nianan.ggff.net/log/error.log;
    client_max_body_size 4m;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/nianan.ggff.net/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/nianan.ggff.net/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:LEARNING_SSL:10m;
    ssl_session_timeout 10m;

    include /www/sites/learnsphere.nianan.ggff.net/proxy/*.conf;
}
